<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-DECK // 战略指挥中心 V9</title>
    <style>
        :root {
            --neon: #00f2ff;
            --neon-alt: #7000ff;
            --bg: #050505;
            --panel: rgba(12, 12, 25, 0.85);
            --border: rgba(0, 242, 255, 0.25);
            --text: #b3faff;
            --grid: rgba(0, 242, 255, 0.05);
            --trans: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        [data-theme="light"] {
            --neon: #0066ff;
            --neon-alt: #6200ea;
            --bg: #f4f7fa;
            --panel: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 102, 255, 0.2);
            --text: #1a1a2e;
            --grid: rgba(0, 0, 0, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            font-family: 'Segoe UI', 'Orbitron', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background 0.5s;
        }

        /* --- 零延迟霓虹光标 --- */
        #neon-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            z-index: 10000;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            filter: drop-shadow(0 0 5px var(--neon));
        }

        #neon-cursor svg {
            fill: var(--neon);
            width: 100%;
            height: 100%;
        }

        .click-ripple {
            position: fixed;
            border: 2px solid var(--neon);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: ripple-ani 0.5s ease-out forwards;
        }

        @keyframes ripple-ani {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                width: 80px;
                height: 80px;
                opacity: 0;
            }
        }

        /* --- 背景装饰 --- */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* --- 侧边栏结构 --- */
        .sidebar {
            width: 320px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 0;
        }

        .glass-card {
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            position: relative;
        }

        /* 时钟 & 本周进度 */
        .time-display {
            font-size: 3rem;
            font-weight: 800;
            text-shadow: 0 0 15px var(--neon);
            font-family: monospace;
            text-align: center;
        }

        .week-bar-wrap {
            margin-top: 15px;
        }

        .bar-label {
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .bar-outer {
            height: 4px;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--neon), var(--neon-alt));
            box-shadow: 0 0 10px var(--neon);
            transition: width 1s;
        }

        /* 状态监控 */
        .stat-item {
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon);
        }

        /* 待办事项 */
        .todo-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            padding: 5px 0;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .todo-item {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }

        .todo-del {
            color: var(--neon-alt);
            cursor: pointer;
            opacity: 0.5;
        }

        .todo-del:hover {
            opacity: 1;
        }

        /* --- 右侧内容区 --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .main-content::-webkit-scrollbar {
            width: 5px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: var(--neon);
        }

        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            margin-bottom: 40px;
        }

        .search-bar {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px 30px;
            border-radius: 50px;
            color: var(--text);
            font-size: 1.2rem;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* 分类渲染 */
        .cat-section {
            margin-bottom: 50px;
            animation: slideIn 0.5s ease-out both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cat-header {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: var(--neon-alt);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cat-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--neon-alt), transparent);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .link-card {
            background: rgba(128, 128, 128, 0.03);
            border: 1px solid rgba(128, 128, 128, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: var(--trans);
        }

        .link-card:hover {
            border-color: var(--neon);
            background: rgba(0, 242, 255, 0.05);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .link-name {
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }

        /* 主题开关 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--neon);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
    </style>
</head>

<body data-theme="dark">

    <div id="neon-cursor">
        <svg viewBox="0 0 32 32">
            <path d="M8 2 L24 16 L16 16 L22 28 L18 30 L12 18 L8 22 Z" />
        </svg>
    </div>

    <div class="bg-grid"></div>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>

    <aside class="sidebar">
        <!-- 时钟 & 进度 -->
        <div class="glass-card">
            <div class="time-display" id="clock">00:00:00</div>
            <div id="date-str" style="text-align: center; font-size: 0.8rem; color: var(--neon); opacity: 0.7;">
                LOADING...</div>
            <div class="week-bar-wrap">
                <div class="bar-label"><span>WEEK PROGRESS</span><span id="week-percent">0%</span></div>
                <div class="bar-outer">
                    <div class="bar-inner" id="week-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 天气模块 (wttr.in) -->
        <div class="glass-card" id="weather-panel">
            <div style="font-size: 0.7rem; color: var(--neon-alt); letter-spacing: 2px; margin-bottom: 10px;">//
                CLIMATE_SYNC</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="temp-val" style="font-size: 2rem; font-weight: bold; color: var(--neon);">--°C</span>
                <span id="weather-desc" style="font-size: 0.8rem;">Searching...</span>
            </div>
            <div id="weather-detail" style="font-size: 0.7rem; opacity: 0.6; margin-top: 10px;">Locating node...</div>
        </div>

        <!-- 系统状态 -->
        <div class="glass-card">
            <div style="font-size: 0.7rem; color: var(--neon-alt); letter-spacing: 2px; margin-bottom: 15px;">//
                CORE_STATUS</div>
            <div class="stat-item">
                <div class="bar-label"><span>NETWORK</span><span id="net-status">ONLINE</span></div>
                <div class="bar-outer">
                    <div class="bar-inner" id="net-bar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="bar-label"><span>BATTERY_LEVEL</span><span id="batt-val">100%</span></div>
                <div class="bar-outer">
                    <div class="bar-inner" id="batt-bar" style="width: 100%; background: #00ff88;"></div>
                </div>
            </div>
        </div>

        <!-- 备忘录 -->
        <div class="glass-card" style="flex: 1;">
            <div style="font-size: 0.7rem; color: var(--neon-alt); letter-spacing: 2px; margin-bottom: 10px;">//
                MEMO_PAD</div>
            <input type="text" class="todo-input" id="todo-in" placeholder="+ Add memo and press Enter">
            <div id="todo-list"></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="search-container">
            <input type="text" class="search-bar" id="search-in" placeholder="Execute Search Across All Nodes..."
                autocomplete="off">
        </div>
        <div id="content-render"></div>
    </main>

    <script>
        const config = {
            categories: {
                ai: "ARTIFICIAL_INTELLIGENCE",
                search: "GLOBAL_SEARCH",
                dev: "FORGE_TOOLS",
                media: "ENTERTAINMENT",
                social: "NEXUS_HUB"
            },
            links: [
                { name: "ChatGPT", url: "https://chat.openai.com", cat: "ai", icon: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" },
                { name: "AI Studio", url: "https://aistudio.google.com", cat: "ai", icon: "https://www.gstatic.com/aistudio/zero-state/promo_chat_url_context.png" },
                { name: "通义千问", url: "https://chat.qwen.ai/", cat: "ai", icon: "https://img.alicdn.com/imgextra/i4/O1CN01c26iB51UyR3MKMFma_!!6000000002586-2-tps-124-124.png" },
                { name: "Google", url: "https://www.google.com", cat: "search", icon: "https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" },
                { name: "Bing", url: "https://www.bing.com", cat: "search", icon: "https://www.bing.com/favicon.ico" },
                { name: "GitHub", url: "https://github.com", cat: "dev", icon: "https://github.githubassets.com/favicons/favicon.png" },
                { name: "Notion", url: "https://www.notion.so", cat: "dev", icon: "https://www.notion.so/images/favicon.ico" },
                { name: "OpenWrt", url: "http://192.168.30.100", cat: "dev", icon: "https://openwrt.org/_media/favicon.ico" },
                { name: "Bilibili", url: "https://t.bilibili.com/", cat: "media", icon: "https://static.hdslb.com/images/favicon.ico" },
                { name: "YouTube", url: "https://www.youtube.com", cat: "media", icon: "https://www.youtube.com/favicon.ico" },
                { name: "虎牙直播", url: "https://www.huya.com", cat: "media", icon: "https://a.msstatic.com/huya/hd/h5/static-source/main/logo2.png" },
                { name: "知乎", url: "https://www.zhihu.com", cat: "social", icon: "https://static.zhihu.com/heifetz/favicon.ico" },
                { name: "微博", url: "https://weibo.com", cat: "social", icon: "https://weibo.com/favicon.ico" },
                { name: "Gmail", url: "https://mail.google.com", cat: "social", icon: "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" }
            ]
        };

        // --- 0 延迟光标 ---
        const cursor = document.getElementById('neon-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });
        document.addEventListener('mousedown', e => {
            const r = document.createElement('div');
            r.className = 'click-ripple';
            r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 500);
        });

        // --- 核心渲染引擎 ---
        function render(keyword = '') {
            const container = document.getElementById('content-render');
            container.innerHTML = '';

            Object.keys(config.categories).forEach(catKey => {
                const filtered = config.links.filter(l =>
                    l.cat === catKey && l.name.toLowerCase().includes(keyword.toLowerCase())
                );

                if (filtered.length > 0) {
                    const section = document.createElement('section');
                    section.className = 'cat-section';
                    section.innerHTML = `
                        <div class="cat-header">// ${config.categories[catKey]}</div>
                        <div class="links-grid">
                            ${filtered.map(l => `
                                <a href="${l.url}" class="link-card" target="_blank">
                                    <div class="icon-box">${getIcon(l)}</div>
                                    <div class="link-name">${l.name}</div>
                                </a>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        }

        function getIcon(link) {
            const colors = ['#ff0055', '#00f2ff', '#7000ff', '#ffaa00', '#00ff88'];
            const color = colors[Math.abs(link.name.length) % colors.length];
            return `<img src="${link.icon}" onerror="this.outerHTML='<div class=\'icon-fallback\' style=\'background:${color}\'>${link.name[0].toUpperCase()}</div>'">`;
        }

        // --- 天气模块 (wttr.in) ---
        async function updateWeather() {
            try {
                // 使用 JSON 格式获取实时天气
                const res = await fetch('https://wttr.in/?format=j1');
                const data = await res.json();
                const cur = data.current_condition[0];
                document.getElementById('temp-val').innerText = `${cur.temp_C}°C`;
                document.getElementById('weather-desc').innerText = cur.lang_zh ? cur.lang_zh[0].value : cur.weatherDesc[0].value;
                document.getElementById('weather-detail').innerText = `Wind: ${cur.windspeedKmph}km/h | Feels: ${cur.FeelsLikeC}°C`;
            } catch (e) {
                document.getElementById('weather-desc').innerText = "Offline Mode";
            }
        }

        // --- 系统状态监控 ---
        function updateSystem() {
            // 网络
            const net = navigator.onLine;
            document.getElementById('net-status').innerText = net ? "ONLINE" : "OFFLINE";
            document.getElementById('net-bar').style.width = net ? "100%" : "10%";
            document.getElementById('net-bar').style.background = net ? "var(--neon)" : "var(--neon-alt)";

            // 电池
            if (navigator.getBattery) {
                navigator.getBattery().then(batt => {
                    const updateBatt = () => {
                        const lvl = Math.round(batt.level * 100);
                        document.getElementById('batt-val').innerText = `${lvl}%`;
                        document.getElementById('batt-bar').style.width = `${lvl}%`;
                    };
                    updateBatt();
                    batt.addEventListener('levelchange', updateBatt);
                });
            }
        }

        // --- 本周进度 ---
        function updateProgress() {
            const now = new Date();
            const day = now.getDay() === 0 ? 7 : now.getDay();
            const percent = Math.round((day / 7) * 100);
            document.getElementById('week-percent').innerText = `${percent}%`;
            document.getElementById('week-bar').style.width = `${percent}%`;

            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('date-str').innerText = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }).toUpperCase();
        }

        // --- 待办事项逻辑 ---
        const todoIn = document.getElementById('todo-in');
        const todoList = document.getElementById('todo-list');

        function saveTodos() {
            const items = Array.from(todoList.querySelectorAll('.todo-text')).map(span => span.innerText);
            localStorage.setItem('cyber-todos', JSON.stringify(items));
        }

        function addTodo(text) {
            const div = document.createElement('div');
            div.className = 'todo-item';
            div.innerHTML = `<span class="todo-text">${text}</span><span class="todo-del" onclick="this.parentElement.remove();saveTodos();">✕</span>`;
            todoList.appendChild(div);
            saveTodos();
        }

        todoIn.addEventListener('keypress', e => {
            if (e.key === 'Enter' && todoIn.value.trim()) {
                addTodo(todoIn.value.trim());
                todoIn.value = '';
            }
        });

        // --- 主题控制 ---
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        }

        // --- 初始化 ---
        function init() {
            render();
            updateProgress();
            updateSystem();
            updateWeather();
            setInterval(updateProgress, 1000);
            setInterval(updateWeather, 600000); // 10分钟更新一次天气

            // 加载待办
            const saved = JSON.parse(localStorage.getItem('cyber-todos') || '[]');
            saved.forEach(addTodo);

            // 搜索监听
            document.getElementById('search-in').addEventListener('input', e => render(e.target.value));

            // 快捷键
            window.addEventListener('keydown', e => {
                if (e.key === '/') { e.preventDefault(); document.getElementById('search-in').focus(); }
            });
        }

        init();
    </script>
</body>

</html>
