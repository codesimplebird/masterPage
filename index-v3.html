<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-DECK V16</title>
    <meta name="description" content="A cyberpunk-style HTML navigation page for quick access to favorite websites.">
    <meta name="theme-color" content="#050508" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">

    <script>
        (function () {
            try {
                var t = localStorage.getItem('cyber-v16-theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.geekzu.org" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.geekzu.org/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap">
    <link rel="stylesheet"
          href="https://fonts.geekzu.org/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
          media="print" onload="this.media='all'">

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">

    <link rel="dns-prefetch" href="//www.google.com">
    <link rel="dns-prefetch" href="//github.githubassets.com">
    <link rel="dns-prefetch" href="//static.hdslb.com">
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//chatgpt.com">

    <style>
        :root {
            --neon: #00f2ff;
            --neon-alt: #9d50ff;
            --bg: #050508;
            --panel: rgba(15, 15, 25, 0.92);
            --border: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --grid-color: rgba(0, 242, 255, 0.05);
            --sidebar-w: 320px;
        }

        [data-theme="light"] {
            --neon: #0055ff;
            --neon-alt: #6200ea;
            --bg: #eef1f6;
            --panel: rgba(255, 255, 255, 0.92);
            --border: rgba(0, 85, 255, 0.25);
            --text-main: #14161f;
            --text-sub: #454a5a;
            --grid-color: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background 0.5s ease, color 0.5s ease;
        }

        #neon-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            margin: -15px 0 0 -15px;
            z-index: 10000;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            display: none;
            color: var(--neon);
            transition: color 0.18s ease;
        }

        .cursor-core { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
        .cursor-ring { position: absolute; inset: 3px; border: 1px solid currentColor; border-radius: 50%; opacity: 0.78; box-shadow: 0 0 12px color-mix(in srgb, currentColor 55%, transparent), inset 0 0 7px color-mix(in srgb, currentColor 20%, transparent); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.25s ease, opacity 0.25s ease; }
        #neon-cursor.is-action .cursor-ring { transform: scale(1.38); border-radius: 36% 64% 58% 42%; opacity: 1; }
        #neon-cursor.is-pressed .cursor-ring { transform: scale(0.58); }
        }

        @media (hover: hover) and (pointer: fine) {
            * {
                cursor: revert !important;
            }
        }

        /* 使用系统指针：离开页面时浏览器会自动隐藏，无视觉残留。 */
        #neon-cursor,
        .click-ripple {
            display: none !important;
        }

        .click-ripple {
            position: fixed;
            border: 1px solid var(--ripple-color, var(--neon));
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: ripple-ani 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes ripple-ani {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                width: 56px;
                height: 56px;
                opacity: 0;
            }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            -webkit-mask-image: radial-gradient(circle, black, transparent 90%);
            mask-image: radial-gradient(circle, black, transparent 90%);
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--panel);
            backdrop-filter: blur(40px);
            border-right: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .side-panel {
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            border-left: 4px solid var(--neon);
        }

        .clock-wrap {
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }

        .clock-time {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1;
        }

        .clock-sec {
            font-size: 1.8rem;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
        }

        .clock-date {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-family: 'JetBrains Mono';
        }

        .bar-outer {
            height: 4px;
            background: rgba(128, 128, 128, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bar-inner {
            height: 100%;
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon);
            transition: width 0.6s;
        }

        .memo {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .memo .txt {
            word-break: break-all;
        }

        .memo .del {
            opacity: 0.3;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-size: 0.85rem;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .memo .del:hover {
            opacity: 1;
            color: var(--neon);
        }

        #todo-in {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.8rem;
            padding: 10px 0;
            outline: none;
        }

        #todo-list {
            margin-top: 10px;
            font-size: 0.75rem;
            overflow-y: auto;
            flex: 1;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 40px;
            overflow-x: auto;
            min-width: 0;
        }

        .search-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .search-bar {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.2rem;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .search-bar:focus {
            border-color: var(--neon);
            box-shadow: 0 0 20px var(--neon);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--neon);
            outline-offset: 2px;
        }

        #render-area {
            display: flex;
            gap: 35px;
            height: 100%;
            align-items: flex-start;
        }

        .cat-column {
            min-width: 320px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.6s ease-out both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cat-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 22px;
            padding: 8px 12px;
            border-left: 4px solid var(--neon-alt);
            border-bottom: 1px solid color-mix(in srgb, var(--neon-alt) 36%, transparent);
            letter-spacing: 2.5px;
            text-shadow: 0 0 18px color-mix(in srgb, var(--neon-alt) 58%, transparent);
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .cat-emoji {
            display: inline-grid;
            place-items: center;
            width: 1.65em;
            height: 1.65em;
            font-size: 1.2em;
            background: color-mix(in srgb, var(--neon-alt) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--neon-alt) 44%, transparent);
            border-radius: 7px;
            animation: categoryPulse 2.8s ease-in-out infinite;
        }

        @keyframes categoryPulse {
            0%, 100% { transform: translateY(0) rotate(0); filter: drop-shadow(0 0 0 transparent); }
            50% { transform: translateY(-3px) rotate(-5deg); filter: drop-shadow(0 0 8px var(--neon-alt)); }
        }

        .cat-count {
            opacity: 0.5;
            margin-left: 6px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            --card-accent: var(--neon);
            background: rgba(128, 128, 128, 0.03);
            border: 1px solid rgba(128, 128, 128, 0.08);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .link-card::before {
            content: '';
            position: absolute;
            z-index: -1;
            inset: 0 auto 0 0;
            width: 28%;
            opacity: 0.3;
            background: linear-gradient(90deg, var(--card-accent), transparent 100%);
            transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        .link-card:hover,
        .link-card.focused {
            background: color-mix(in srgb, var(--card-accent) 7%, var(--panel));
            border-color: color-mix(in srgb, var(--card-accent) 72%, transparent);
            transform: translateX(12px);
            box-shadow: -10px 10px 25px rgba(0, 0, 0, 0.2), 0 0 20px color-mix(in srgb, var(--card-accent) 22%, transparent);
        }

        .link-card:hover::before,
        .link-card.focused::before {
            width: 112%;
            opacity: 0.48;
        }

        .search-highlight {
            background: rgba(0, 242, 255, 0.2);
            color: var(--neon);
            border-radius: 2px;
            padding: 0 1px;
        }

        .search-bar:not(:placeholder-shown)+.search-hint {
            opacity: 0;
        }

        .search-hint {
            transition: opacity 0.2s;
        }

        .icon-wrap {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .icon-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            font-family: 'JetBrains Mono';
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .link-name {
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
        }

        .link-url {
            color: var(--text-sub);
            font-size: 0.7rem;
            font-family: 'JetBrains Mono';
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-hint {
            color: var(--text-sub);
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--neon);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            font-size: 20px;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            box-shadow: 0 0 15px var(--neon);
            transform: scale(1.1);
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1002;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--neon);
            font-size: 20px;
            align-items: center;
            justify-content: center;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }

        @media (max-width: 860px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.open~.sidebar-backdrop {
                display: block;
            }

            .main-content {
                padding: 80px 20px 30px;
            }

            #render-area {
                flex-direction: column;
                gap: 30px;
            }

            .cat-column {
                min-width: 0;
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="neon-cursor" aria-hidden="true"><span class="cursor-ring"></span><span class="cursor-core"></span></div>

    <div class="bg-grid" aria-hidden="true"></div>

    <button class="theme-toggle" id="theme-btn" type="button" aria-label="切换深色/浅色主题" title="切换主题">🌓</button>
    <button class="menu-toggle" id="menu-btn" type="button" aria-label="打开侧边面板" aria-expanded="false">☰</button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="系统状态面板">
        <div class="side-panel clock-wrap">
            <div style="font-size: 0.7rem; color: var(--neon); letter-spacing: 2px;">SECURE_TIME</div>
            <div>
                <span class="clock-time" id="time-hm">00:00</span><span class="clock-sec" id="time-s">00</span>
            </div>
            <div class="clock-date" id="date-str">BOOTING...</div>
        </div>

        <div class="side-panel">
            <div class="stat-label"><span>WEATHER</span><span id="weather-desc">LOADING</span></div>
            <div style="font-size: 2rem; font-weight: bold; color: var(--neon); margin: 5px 0;" id="temp-val">--°C</div>

            <div class="stat-label"><span id="batt-label">POWER</span><span id="batt-val">--</span></div>
            <div class="bar-outer">
                <div class="bar-inner" id="batt-bar" style="width: 100%;"></div>
            </div>

            <div class="stat-label"><span>WEEK_FLOW</span><span id="week-val">0%</span></div>
            <div class="bar-outer">
                <div class="bar-inner" id="week-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="side-panel" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
            <div class="stat-label" style="color: var(--neon-alt);">[ MEMO_PAD ]</div>
            <label for="todo-in" class="sr-only"
                   style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">新增备忘</label>
            <input type="text" id="todo-in" placeholder="+ Add new note...">
            <div id="todo-list" role="list"></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="search-container">
            <p class="search-hint"
               style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 15px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;">
                // A simple HTML navigation page · 按 <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 清空 · <kbd>↑↓</kbd> 导航 · <kbd>Enter</kbd> 打开</p>
            <input type="text" class="search-bar" id="search-in" placeholder="Query Global Intelligence..."
                   autocomplete="off" aria-label="搜索链接">
        </div>

        <div id="render-area" aria-live="polite"></div>
    </main>

    <noscript>
        <div
             style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text-main);font-family:sans-serif;text-align:center;padding:20px;">
            本导航页依赖 JavaScript 渲染。请在浏览器设置中启用 JavaScript 后刷新。
        </div>
    </noscript>

                { name: "Gmail", url: "https://mail.google.com", cat: "social", icon: "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" },
                { name: "X / Twitter", url: "https://x.com", cat: "social", icon: "https://abs.twimg.com/favicons/twitter.2.ico" },
                { name: "Discord", url: "https://discord.com", cat: "social", icon: "https://discord.com/favicon.ico" },
                { name: "Reddit", url: "https://www.reddit.com", cat: "social", icon: "https://www.redditstatic.com/desktop2x/img/favicon/favicon-32x32.png" },
                { name: "知乎", url: "https://www.zhihu.com", cat: "social", icon: "https://static.zhihu.com/heifetz/favicon.ico" },
                { name: "微博", url: "https://weibo.com", cat: "social", icon: "https://weibo.com/favicon.ico" },
                { name: "Telegram", url: "https://web.telegram.org", cat: "social", icon: "https://web.telegram.org/favicon.ico" },

                { name: "Google", url: "https://www.google.com", cat: "search", icon: "https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" },
                { name: "Bing", url: "https://www.bing.com", cat: "search", icon: "https://www.bing.com/favicon.ico" },
                { name: "DuckDuckGo", url: "https://duckduckgo.com", cat: "search", icon: "https://duckduckgo.com/favicon.ico" },
                { name: "百度", url: "https://www.baidu.com", cat: "search", icon: "https://www.baidu.com/favicon.ico" },
                { name: "WolframAlpha", url: "https://www.wolframalpha.com", cat: "search", icon: "https://www.wolframalpha.com/_cdn/favicon.ico" }
            ]
        };

        const $ = id => document.getElementById(id);

        const els = {
            themeBtn: $('theme-btn'),
            menuBtn: $('menu-btn'),
            sidebar: $('sidebar'),
            backdrop: $('sidebar-backdrop'),
            searchIn: $('search-in'),
            renderArea: $('render-area'),
            timeHm: $('time-hm'),
            timeS: $('time-s'),
            dateStr: $('date-str'),
            weekVal: $('week-val'),
            weekBar: $('week-bar'),
            tempVal: $('temp-val'),
            weatherDesc: $('weather-desc'),
            battVal: $('batt-val'),
            battBar: $('batt-bar'),
            battLabel: $('batt-label'),
            todoIn: $('todo-in'),
            todoList: $('todo-list'),
            neonCursor: $('neon-cursor')
        };

        function safeHostname(url) {
            try { return new URL(url).hostname || url; } catch (e) { return url; }
        }

        function hashColor(s) {
            const sum = String(s || '').split('').reduce((a, b) => a + b.charCodeAt(0), 0);
            return `hsl(${Math.abs(sum) % 360}, 60%, 50%)`;
        }

        const brandColors = {
            'bilibili.com': '#00aeec', 'youtube.com': '#ff0033', 'netflix.com': '#e50914',
            'twitch.tv': '#9146ff', 'spotify.com': '#1ed760', 'steampowered.com': '#1b86d1',
            'huya.com': '#ff7f00', 'google.com': '#4285f4', 'xiaomimimo.com': '#ff6900',
            'qwen.ai': '#6a5cff', 'chatgpt.com': '#10a37f', 'deepseek.com': '#4d6bfe',
            'claude.ai': '#d97757', 'gemini.google.com': '#4285f4', 'moonshot.cn': '#5d63f5',
            'midjourney.com': '#b8a6ff', 'github.com': '#8b949e', 'vercel.com': '#e6e6e6',
            'notion.so': '#f5f5f5', 'figma.com': '#f24e1e', 'canva.com': '#00c4cc',
            'stackoverflow.com': '#f48024', 'mail.google.com': '#ea4335', 'x.com': '#a9b1bb',
            'discord.com': '#5865f2', 'reddit.com': '#ff4500', 'zhihu.com': '#0084ff',
            'weibo.com': '#e6162d', 'telegram.org': '#229ed9', 'bing.com': '#008373',
            'duckduckgo.com': '#de5833', 'baidu.com': '#2932e1', 'wolframalpha.com': '#e3442a'
        };

        const categoryEmojis = { media: '🎬', ai: '🧠', dev: '🛠️', social: '💬', search: '🔎' };

        function accentColor(link) {
            const host = safeHostname(link.url).replace(/^www\./, '');
            const match = Object.keys(brandColors).find(domain => host.endsWith(domain));
            return match ? brandColors[match] : hashColor(link.name || host);
        }

        function debounce(fn, ms) {
            let t;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        function highlightMatch(text, query) {
            if (!query) return document.createTextNode(text);
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return document.createTextNode(text);
            const frag = document.createDocumentFragment();
            frag.appendChild(document.createTextNode(text.slice(0, idx)));
            const mark = document.createElement('span');
            mark.className = 'search-highlight';
            mark.textContent = text.slice(idx, idx + query.length);
            frag.appendChild(mark);
            frag.appendChild(document.createTextNode(text.slice(idx + query.length)));
            return frag;
        }

        function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        const LS = {
            get(key, fallback) {
                try {
                    const v = localStorage.getItem(key);
                    return v != null ? JSON.parse(v) : fallback;
                } catch (e) { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { }
            }
        };

        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            LS.set('cyber-v16-theme', theme);
        }

        els.themeBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

        function buildIcon(link) {
            const wrap = document.createElement('div');
            wrap.className = 'icon-wrap';
            const name = link.name || '?';
            const img = document.createElement('img');
            img.className = 'link-icon';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.alt = name;
            img.onerror = () => {
                if (!wrap.contains(img)) return;
                const fb = document.createElement('div');
                fb.className = 'icon-fallback';
                fb.style.background = hashColor(name);
                fb.textContent = name[0].toUpperCase();
                wrap.replaceChild(fb, img);
            };
            img.src = link.icon;
            wrap.appendChild(img);
            return wrap;
        }

        function buildCard(link, query) {
            const a = document.createElement('a');
            a.href = link.url;
            a.className = 'link-card';
            a.style.setProperty('--card-accent', accentColor(link));
            a.target = '_self';
            a.rel = 'noopener noreferrer';

            a.appendChild(buildIcon(link));

            const info = document.createElement('div');
            info.className = 'link-info';
            const nameEl = document.createElement('span');
            nameEl.className = 'link-name';
            nameEl.appendChild(highlightMatch(link.name, query));
            const urlEl = document.createElement('span');
            urlEl.className = 'link-url';
            urlEl.textContent = safeHostname(link.url);
            info.appendChild(nameEl);
            info.appendChild(urlEl);
            a.appendChild(info);
            return a;
        }

        let currentQuery = '';

        function render(kw) {
            els.renderArea.innerHTML = '';
            const q = (kw || '').toLowerCase().trim();
            currentQuery = q;
            let total = 0;

            config.categories.forEach((cat, catIdx) => {
                const list = config.links.filter(l => {
                    if (l.cat !== cat.id) return false;
                    if (!q) return true;
                    return (l.name || '').toLowerCase().includes(q)
                        || (l.url || '').toLowerCase().includes(q)
                        || cat.name.toLowerCase().includes(q);
                });
                if (list.length === 0) return;
                total += list.length;

                const col = document.createElement('div');
                col.className = 'cat-column';
                col.style.animationDelay = `${catIdx * 0.1}s`;

                const header = document.createElement('div');
                header.className = 'cat-header';
                const emoji = document.createElement('span');
                emoji.className = 'cat-emoji';
                emoji.textContent = categoryEmojis[cat.id] || '✦';
                emoji.setAttribute('aria-hidden', 'true');
                header.appendChild(emoji);
                header.appendChild(document.createTextNode(cat.name));
                const cnt = document.createElement('span');
                cnt.className = 'cat-count';
                cnt.textContent = `(${list.length})`;
                header.appendChild(cnt);
                col.appendChild(header);

                const ul = document.createElement('div');
                ul.className = 'links-list';
                list.forEach((l, i) => {
                    const card = buildCard(l, q);
                    card.style.animationDelay = `${catIdx * 0.1 + i * 0.05}s`;
                    ul.appendChild(card);
                });
                col.appendChild(ul);

                els.renderArea.appendChild(col);
            });

            if (total === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = q ? `// 未匹配到 "${kw}" 的结果` : '// 暂无链接';
                els.renderArea.appendChild(hint);
            }
        }

        function updateClock() {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            els.timeHm.textContent = time.substring(0, 5);
            els.timeS.textContent = time.substring(6, 8);
            els.dateStr.textContent =
                now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
            const day = now.getDay() === 0 ? 7 : now.getDay();
            const per = Math.round((day / 7) * 100);
            els.weekVal.textContent = per + '%';
            els.weekBar.style.width = per + '%';
        }

        const WEATHER_KEY = 'cyber-v16-weather';
        function applyWeather(tempC, desc) {
            els.tempVal.textContent = `${tempC}°C`;
            els.weatherDesc.textContent = String(desc || '').toUpperCase();
        }
        function loadCachedWeather() {
            const obj = LS.get(WEATHER_KEY, null);
            if (obj && obj.ts && Date.now() - obj.ts < 3600000) {
                applyWeather(obj.tempC, obj.desc);
            }
        }
        async function updateWeather() {
            if (document.hidden) return;
            try {
                const res = await fetchWithTimeout('https://wttr.in/?format=j1', {}, 8000);
                const data = await res.json();
                const cur = data.current_condition[0];
                const tempC = cur.temp_C;
                const desc = cur.weatherDesc[0].value;
                applyWeather(tempC, desc);
                LS.set(WEATHER_KEY, { tempC, desc, ts: Date.now() });
            } catch (e) {
                els.weatherDesc.textContent = 'OFFLINE';
            }
        }

        function setupBattery() {
            if (!navigator.getBattery) {
                els.battLabel.textContent = 'POWER';
                els.battVal.textContent = 'N/A';
                els.battBar.style.width = '0%';
                els.battBar.style.background = 'var(--text-sub)';
                els.battBar.style.boxShadow = 'none';
                return;
            }
            navigator.getBattery().then(b => {
                const fn = () => {
                    const pct = Math.round(b.level * 100);
                    els.battVal.textContent = pct + '%';
                    els.battBar.style.width = pct + '%';
                };
                fn();
                b.addEventListener('levelchange', fn);
            }).catch(() => { });
        }

        function setupMemo() {
            const KEY = 'v16-memos';

            const save = () => {
                const items = Array.from(els.todoList.querySelectorAll('.memo .txt')).map(s => s.textContent);
                LS.set(KEY, items);
            };

            const add = (text) => {
                if (!text) return;
                const d = document.createElement('div');
                d.className = 'memo';
                d.setAttribute('role', 'listitem');

                const span = document.createElement('span');
                span.className = 'txt';
                span.textContent = text;

                const del = document.createElement('button');
                del.className = 'del';
                del.type = 'button';
                del.setAttribute('aria-label', '删除该备忘');
                del.textContent = '✕';

                d.appendChild(span);
                d.appendChild(del);
                els.todoList.appendChild(d);
            };

            els.todoList.addEventListener('click', e => {
                const btn = e.target.closest('.del');
                if (!btn) return;
                btn.closest('.memo')?.remove();
                save();
            });

            els.todoIn.addEventListener('keydown', e => {
                if (e.key === 'Enter' && els.todoIn.value.trim()) {
                    add(els.todoIn.value.trim());
                    els.todoIn.value = '';
                    save();
                }
            });

            (LS.get(KEY, []) || []).forEach(add);
        }

        let focusIdx = -1;

        function getVisibleCards() {
            return Array.from(els.renderArea.querySelectorAll('.link-card'));
        }

        function setFocus(idx) {
            const cards = getVisibleCards();
            cards.forEach(c => c.classList.remove('focused'));
            if (idx >= 0 && idx < cards.length) {
                cards[idx].classList.add('focused');
                cards[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
            focusIdx = idx;
        }

        function setupSearch() {
            const debouncedRender = debounce(v => {
                render(v);
                focusIdx = -1;
            }, 120);
            els.searchIn.addEventListener('input', e => debouncedRender(e.target.value));
            els.searchIn.addEventListener('keydown', e => {
                const cards = getVisibleCards();
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setFocus(Math.min(focusIdx + 1, cards.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setFocus(Math.max(focusIdx - 1, 0));
                } else if (e.key === 'Enter') {
                    const target = focusIdx >= 0 ? cards[focusIdx] : cards[0];
                    if (target) window.location.href = target.href;
                } else if (e.key === 'Escape') {
                    els.searchIn.value = '';
                    render('');
                    focusIdx = -1;
                }
            });
        }

        document.addEventListener('keydown', e => {
            const tag = (document.activeElement && document.activeElement.tagName) || '';
            const typing = tag === 'INPUT' || tag === 'TEXTAREA';
            if (e.key === '/' && !typing) {
                e.preventDefault();
                els.searchIn.focus();
            }
        });

        function setupCursor() {
            if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            let mx = 0, my = 0, rafId = null;
            document.addEventListener('mousemove', e => {
                mx = e.clientX; my = e.clientY;
                if (rafId) return;
                rafId = requestAnimationFrame(() => {
                    els.neonCursor.style.transform = `translate3d(${mx}px, ${my}px, 0)`;
                    rafId = null;
                });
            });
            document.addEventListener('mouseover', e => {
                const target = e.target.closest('a, button, input, .memo');
                const card = e.target.closest('.link-card');
                els.neonCursor.classList.toggle('is-action', Boolean(target));
                els.neonCursor.style.color = card ? getComputedStyle(card).getPropertyValue('--card-accent').trim() : 'var(--neon)';
            });
            document.addEventListener('mousedown', e => {
                els.neonCursor.classList.add('is-pressed');
                const r = document.createElement('div');
                r.className = 'click-ripple';
                r.style.left = e.clientX + 'px';
                r.style.top = e.clientY + 'px';
                r.style.setProperty('--ripple-color', els.neonCursor.style.color || 'var(--neon)');
                document.body.appendChild(r);
                setTimeout(() => r.remove(), 500);
            });
            document.addEventListener('mouseup', () => els.neonCursor.classList.remove('is-pressed'));
        }

        function toggleSidebar(open) {
            const o = open == null ? !els.sidebar.classList.contains('open') : open;
            els.sidebar.classList.toggle('open', o);
            els.menuBtn.setAttribute('aria-expanded', o ? 'true' : 'false');
        }

        function setupSidebar() {
            els.menuBtn.addEventListener('click', () => toggleSidebar());
            els.backdrop.addEventListener('click', () => toggleSidebar(false));

            els.sidebar.addEventListener('click', e => {
                if (e.target.closest('a, .link-card')) toggleSidebar(false);
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && els.sidebar.classList.contains('open')) {
                    toggleSidebar(false);
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) updateWeather();
        });

        function init() {
            updateClock();
            setInterval(updateClock, 1000);

            setupBattery();
            setupMemo();
            setupSearch();
            setupCursor();
            setupSidebar();
            loadCachedWeather();

            setTimeout(() => {
                render();
                updateWeather();
                setInterval(updateWeather, 600000);
            }, 200);
        }

        init();
    </script>
</body>

</html>
