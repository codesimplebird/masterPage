<!DOCTYPE html>
<html lang="zh-CN">

<!-- deepseek提出的方案无法实现,由谷歌实现了 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个性化数字仪表盘">
    <title>我的数字指挥舱 V4 (修复版)</title>
    <style>
        /* --- 基础变量 --- */
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --secondary: #924eff;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
        }

        :root[data-theme="light"] {
            --bg-dark: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --primary: #0066cc;
            --secondary: #7c3aed;
            --text-main: #000000;
            --text-sub: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            /* 使用系统自带的无衬线字体和等宽字体，无需联网加载 */
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s, color 0.5s;
        }

        /* 专门为数字和代码设置等宽字体 */
        .clock-container,
        .weather-temp,
        .status-row {
            font-family: "Consolas", "Monaco", "Courier New", monospace;
        }

        /* --- 背景动效层 --- */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000 100%);
            transition: background 0.5s;
        }

        :root[data-theme="light"] .bg-wrapper {
            background: radial-gradient(circle at 50% 0%, #e0e7ff 0%, #f8fafc 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: floatOrb 25s infinite ease-in-out;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: #4f46e5;
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #c026d3;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(60deg);
            animation: moveGrid 30s linear infinite;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        :root[data-theme="light"] .grid-bg {
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -40px);
            }
        }

        @keyframes moveGrid {
            0% {
                transform: perspective(600px) rotateX(60deg) translateY(0);
            }

            100% {
                transform: perspective(600px) rotateX(60deg) translateY(60px);
            }
        }

        /* --- 主题切换按钮 --- */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: var(--text-main);
        }

        /* --- 主布局 --- */
        .main-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 60px;
            width: 90%;
            max-width: 1600px;
            height: 85vh;
        }

        /* --- 左侧边栏 --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: slideInLeft 0.8s ease-out;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: background 0.3s, border 0.3s;
        }

        /* 时钟样式 */
        .time-card {
            text-align: left;
            position: relative;
            overflow: hidden;
            border-left: 4px solid var(--primary);
        }

        .greeting-text {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .clock-container {
            display: flex;
            align-items: baseline;
            gap: 2px;
            margin-bottom: 5px;
        }

        .clock-main {
            font-size: 3.8rem;
            font-weight: 700;
            background: linear-gradient(180deg, var(--text-main), var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        :root[data-theme="light"] .clock-main {
            background: linear-gradient(180deg, #000, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .colon {
            font-size: 3rem;
            color: var(--text-sub);
            animation: blink 1s steps(1) infinite;
            margin: 0 5px;
            transform: translateY(-5px);
        }

        .clock-seconds {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 400;
            margin-left: 5px;
            opacity: 0.9;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .date-text {
            font-size: 1rem;
            color: var(--text-sub);
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        :root[data-theme="light"] .date-text {
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* 状态条 */
        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 10px;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        :root[data-theme="light"] .progress-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 45%;
            animation: loadProgress 2s ease-out;
        }

        /* --- 右侧内容区 --- */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 40px;
            overflow-y: auto;
            padding: 10px 20px 10px 10px;
            animation: slideInUp 0.8s ease-out 0.2s backwards;
        }

        .content-area::-webkit-scrollbar {
            width: 5px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        :root[data-theme="light"] .content-area::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
        }

        /* 搜索框 */
        .search-box {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 22px 30px;
            font-size: 1.2rem;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            color: var(--text-main);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        :root[data-theme="light"] .search-input {
            background: rgba(240, 240, 245, 0.95);
            color: #000;
        }

        .search-input:focus {
            background: rgba(40, 40, 50, 0.95);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1);
        }

        :root[data-theme="light"] .search-input:focus {
            background: rgba(250, 250, 255, 0.95);
        }

        /* 链接网格 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 35px;
            padding-bottom: 50px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 18px;
            aspect-ratio: 1/1;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            cursor: pointer;
            /* 修复鼠标手势 */
        }

        :root[data-theme="light"] .link-item {
            background: rgba(0, 0, 0, 0.03);
        }

        .link-item:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="light"] .link-item:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.2);
        }

        .link-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 18px;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .link-item:hover .link-icon {
            transform: scale(1.1);
        }

        .link-name {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .link-item:hover .link-name {
            color: var(--text-main);
        }

        /* 拖拽样式 */
        .link-item.dragging {
            opacity: 0.4;
            border: 2px dashed var(--primary);
        }

        .link-item.drag-over {
            border: 2px solid var(--primary);
            transform: scale(1.05);
        }

        /* 天气 */
        .weather-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .weather-temp {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .weather-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .weather-details {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-sub);
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        :root[data-theme="light"] .weather-details {
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* 快捷键提示 */
        .shortcut-hint {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--text-sub);
            background: var(--glass-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            opacity: 0.7;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .search-input:focus+.shortcut-hint {
            opacity: 0;
        }

        /* 动画 */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loadProgress {
            from {
                width: 0;
            }
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 40px;
                height: auto;
                padding: 80px 0 40px;
            }

            .content-area {
                overflow: visible;
                padding: 0;
            }

            .sidebar {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .glass-panel {
                flex: 1;
                min-width: 280px;
            }
        }

        @media (max-width: 480px) {
            .links-grid {
                gap: 20px;
                grid-template-columns: repeat(2, 1fr);
            }

            .clock-main {
                font-size: 2.5rem;
            }

            .clock-seconds {
                font-size: 1.5rem;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg id="theme-icon" viewBox="0 0 24 24">
            <path
                  d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
        </svg>
    </button>

    <div class="bg-wrapper">
        <div class="grid-bg"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="glass-panel time-card">
                <div class="greeting-text" id="greeting">System Online</div>
                <div class="clock-container">
                    <span class="clock-main" id="hour-min">00:00</span>
                    <span class="clock-seconds" id="sec">00</span>
                </div>
                <div class="date-text" id="date-str">Loading Date...</div>
            </div>

            <div class="glass-panel">
                <div style="color: var(--primary); margin-bottom: 15px; font-size: 0.9rem; font-family: monospace;">//
                    DASHBOARD STATUS</div>
                <div class="status-row"><span>CPU LOAD</span><span>14%</span></div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: 14%; background: var(--primary);"></div>
                </div>
                <div class="status-row"><span>MEMORY</span><span>42%</span></div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: 42%; background: var(--secondary);"></div>
                </div>
                <div style="margin-top: 20px; font-style: italic; color: var(--text-sub); font-size: 0.9rem;">
                    "Simplicity is the ultimate sophistication."</div>
            </div>

            <div class="glass-panel weather-card">
                <div style="color: var(--primary); margin-bottom: 15px; font-size: 0.9rem; font-family: monospace;">//
                    WEATHER STATUS</div>
                <div class="weather-info">
                    <div>
                        <div class="weather-temp" id="weather-temp">--°C</div>
                        <div class="weather-desc" id="weather-desc">Loading...</div>
                    </div>
                </div>
                <div class="weather-details">
                    <span id="weather-location">--</span>
                    <span id="weather-humidity">湿度: --%</span>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <div class="search-box">
                <input type="text" class="search-input" id="search-input"
                       placeholder="Search web or filter apps... (Press / to focus)" autocomplete="off">
                <div class="shortcut-hint">Ctrl+K 或 /</div>
            </div>
            <div class="links-grid" id="links-container"></div>
        </main>
    </div>

    <script>
        // 配置数据
        const config = {
            links: [
                { name: "Bilibili", url: "https://www.bilibili.com", icon: "https://static.hdslb.com/images/favicon.ico" },
                { name: "Google", url: "https://www.google.com", icon: "https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" },
                { name: "AI Studio", url: "https://aistudio.google.com", icon: "https://www.gstatic.com/aistudio/zero-state/promo_chat_url_context.png" },
                { name: "Bing", url: "https://www.bing.com", icon: "https://www.bing.com/favicon.ico" },
                { name: "GitHub", url: "https://github.com", icon: "https://github.githubassets.com/favicons/favicon.png" },
                { name: "ChatGPT", url: "https://chat.openai.com", icon: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" },
                { name: "YouTube", url: "https://www.youtube.com", icon: "https://www.youtube.com/s/desktop/1a96390c/img/favicon_144x144.png" },
                { name: "知乎", url: "https://www.zhihu.com", icon: "https://static.zhihu.com/heifetz/favicon.ico" },
                { name: "通义千问", url: "https://chat.qwen.ai/", icon: "https://img.alicdn.com/imgextra/i4/O1CN01c26iB51UyR3MKMFma_!!6000000002586-2-tps-124-124.png" },
                { name: "OpenWrt", url: "http://192.168.30.100", icon: "https://openwrt.org/_media/favicon.ico" },
                { name: "虎牙", url: "https://www.huya.com", icon: "https://a.msstatic.com/huya/hd/h5/static-source/main/logo2.png" },
                { name: "微博", url: "https://weibo.com", icon: "https://weibo.com/favicon.ico" },
                { name: "Gmail", url: "https://mail.google.com", icon: "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" },
                { name: "Notion", url: "https://www.notion.so", icon: "https://www.notion.so/images/favicon.ico" }
            ],
            weatherApiKey: "YOUR_API_KEY_HERE",
            defaultCity: "Beijing"
        };

        // --- 主题切换 ---
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.innerHTML = theme === 'light'
                ? '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'
                : '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
        }

        themeToggle.addEventListener('click', () => {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // --- 时钟 ---
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('hour-min').innerHTML = `${h}<span class="colon">:</span>${m}`;
            document.getElementById('sec').innerText = s;
            document.getElementById('date-str').innerText = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

            const hour = now.getHours();
            let greet = "Good Evening";
            if (hour >= 5 && hour < 12) greet = "Good Morning";
            else if (hour >= 12 && hour < 18) greet = "Good Afternoon";
            document.getElementById('greeting').innerText = `${greet}, Commander.`;
            requestAnimationFrame(updateClock);
        }

        // --- 链接渲染 ---
        const container = document.getElementById('links-container');
        let draggedItem = null;

        function renderLinks(keyword = '') {
            container.innerHTML = '';
            const filtered = config.links.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase()));

            filtered.forEach((link, i) => {
                const el = document.createElement('a');
                el.className = 'link-item';
                el.href = link.url;
                el.draggable = true;
                el.dataset.name = link.name;
                el.style.animation = `slideInUp 0.5s ease forwards ${i * 0.03}s`;
                el.style.opacity = '0';

                // 拖拽逻辑
                el.addEventListener('dragstart', (e) => { draggedItem = el; setTimeout(() => el.classList.add('dragging'), 0); });
                el.addEventListener('dragend', () => { el.classList.remove('dragging'); draggedItem = null; });
                el.addEventListener('dragover', (e) => { e.preventDefault(); });
                el.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== el) {
                        const items = Array.from(container.children);
                        const curIdx = items.indexOf(draggedItem);
                        const targetIdx = items.indexOf(el);
                        if (curIdx < targetIdx) container.insertBefore(draggedItem, el.nextSibling);
                        else container.insertBefore(draggedItem, el);
                        // 保存逻辑可在此扩展
                    }
                });

                const img = document.createElement('img');
                img.className = 'link-icon';
                img.src = link.icon;
                img.onerror = () => { img.src = `https://ui-avatars.com/api/?name=${link.name}&background=333&color=fff`; };

                const name = document.createElement('span');
                name.className = 'link-name';
                name.innerText = link.name;

                el.appendChild(img);
                el.appendChild(name);
                container.appendChild(el);
            });
        }

        // --- 搜索 ---
        const sInput = document.getElementById('search-input');
        sInput.addEventListener('input', (e) => renderLinks(e.target.value));
        sInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && e.target.value) {
                const match = config.links.find(l => l.name.toLowerCase().includes(e.target.value.toLowerCase()));
                window.open(match ? match.url : `https://www.google.com/search?q=${encodeURIComponent(e.target.value)}`, '_self');
            }
        });

        // --- 快捷键 ---
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || e.key === '/') { e.preventDefault(); sInput.focus(); }
            if (e.key === 'Escape') { sInput.value = ''; renderLinks(''); sInput.blur(); }
        });

        // --- 初始化 ---
        function init() {
            initTheme();
            const savedLinks = localStorage.getItem('dashboardLinks');
            if (savedLinks) try { config.links = JSON.parse(savedLinks); } catch (e) { }
            renderLinks();
            updateClock();

            // 模拟天气数据（因为没有Key）
            document.getElementById('weather-temp').innerText = "22°C";
            document.getElementById('weather-desc').innerText = "晴朗";
            document.getElementById('weather-location').innerText = "本地模式";
            document.getElementById('weather-humidity').innerText = "湿度: 55%";
        }

        init();
    </script>
</body>

</html>
