<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的数字指挥舱 V3</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            /* 科技蓝 */
            --secondary: #924eff;
            /* 紫色 */
            --highlight: #ff0055;
            /* 高亮红（用于秒针） */
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 背景动效层 --- */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: floatOrb 25s infinite ease-in-out;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: #4f46e5;
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #c026d3;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(60deg);
            animation: moveGrid 30s linear infinite;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -40px);
            }
        }

        @keyframes moveGrid {
            0% {
                transform: perspective(600px) rotateX(60deg) translateY(0);
            }

            100% {
                transform: perspective(600px) rotateX(60deg) translateY(60px);
            }
        }

        /* --- 主布局 --- */
        .main-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            /* 左侧固定，右侧自适应 */
            gap: 60px;
            /* 增大左右栏间距 */
            width: 90%;
            max-width: 1600px;
            height: 85vh;
        }

        /* --- 左侧边栏 --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: slideInLeft 0.8s ease-out;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* === 优化的时钟样式 === */
        .time-card {
            text-align: left;
            position: relative;
            overflow: hidden;
            border-left: 4px solid var(--primary);
            /* 左侧装饰线 */
        }

        .greeting-text {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .clock-container {
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: baseline;
            gap: 2px;
            margin-bottom: 5px;
        }

        /* 时:分 */
        .clock-main {
            font-size: 3.8rem;
            font-weight: 700;
            background: linear-gradient(180deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        /* 冒号闪烁 */
        .colon {
            font-size: 3rem;
            color: var(--text-sub);
            animation: blink 1s steps(1) infinite;
            margin: 0 5px;
            transform: translateY(-5px);
        }

        /* 秒针 - 独立且显眼 */
        .clock-seconds {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 400;
            margin-left: 5px;
            opacity: 0.9;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .date-text {
            font-size: 1rem;
            color: var(--text-sub);
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 内存状态条 */
        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 45%;
            animation: loadProgress 2s ease-out;
        }

        /* --- 右侧内容区 --- */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 40px;
            overflow-y: auto;
            padding: 10px 20px 10px 10px;
            /* 给滚动条留点位置 */
            animation: slideInUp 0.8s ease-out 0.2s backwards;
        }

        /* 滚动条美化 */
        .content-area::-webkit-scrollbar {
            width: 5px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .search-box {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 22px 30px;
            font-size: 1.2rem;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            color: #fff;
            backdrop-filter: blur(20px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .search-input:focus {
            background: rgba(40, 40, 50, 0.95);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1);
        }

        /* === 优化的链接网格 === */
        .links-grid {
            display: grid;
            /* 最小宽度增加，保持大方块 */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            /* 关键修改：大幅增加间距 */
            gap: 35px;
            padding-bottom: 50px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 18px;
            aspect-ratio: 1/1;
            /* 保持正方形 */
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* 弹性动画 */
            position: relative;
        }

        /* 悬停时的强烈动效 */
        .link-item:hover {
            transform: translateY(-10px) scale(1.05);
            /* 上浮并稍微放大 */
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            /* 增加投影 */
        }

        .link-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 18px;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .link-item:hover .link-icon {
            transform: scale(1.1);
        }

        .link-name {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .link-item:hover .link-name {
            color: #fff;
        }

        /* 动画关键帧 */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loadProgress {
            from {
                width: 0;
            }
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 40px;
                height: auto;
                padding: 40px 0;
            }

            .content-area {
                overflow: visible;
                padding: 0;
            }

            .sidebar {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .glass-panel {
                flex: 1;
                min-width: 280px;
            }

            .clock-main {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .links-grid {
                gap: 20px;
                grid-template-columns: repeat(2, 1fr);
            }

            .clock-main {
                font-size: 2.5rem;
            }

            .clock-seconds {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- 背景特效 -->
    <div class="bg-wrapper">
        <div class="grid-bg"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="main-layout">
        <!-- 左侧面板 -->
        <aside class="sidebar">
            <!-- 1. 时钟模块 -->
            <div class="glass-panel time-card">
                <div class="greeting-text" id="greeting">System Online</div>

                <!-- 优化后的时钟结构 -->
                <div class="clock-container">
                    <span class="clock-main" id="hour-min">00:00</span>
                    <!-- 独立的秒针显示 -->
                    <span class="clock-seconds" id="sec">00</span>
                </div>

                <div class="date-text" id="date-str">
                    Loading Date...
                </div>
            </div>

            <!-- 2. 信息模块 -->
            <div class="glass-panel">
                <div
                     style="font-family: 'JetBrains Mono'; color: var(--primary); margin-bottom: 15px; font-size: 0.9rem;">
                    // DASHBOARD STATUS
                </div>

                <div class="status-row">
                    <span>CPU LOAD</span>
                    <span>14%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: 14%; background: var(--primary);"></div>
                </div>

                <div class="status-row">
                    <span>MEMORY</span>
                    <span>42%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: 42%; background: var(--secondary);"></div>
                </div>

                <div style="margin-top: 20px; font-style: italic; color: #888; font-size: 0.9rem;">
                    "Simplicity is the ultimate sophistication."
                </div>
            </div>
        </aside>

        <!-- 右侧内容 -->
        <main class="content-area">
            <!-- 搜索 -->
            <div class="search-box">
                <input type="text" class="search-input" id="search-input" placeholder="Search web or filter apps..."
                       autocomplete="off">
            </div>

            <!-- 链接网格 -->
            <div class="links-grid" id="links-container">
                <!-- Javascript will load items here -->
            </div>
        </main>
    </div>

    <script>
        // 配置数据
        const config = {
            links: [
                { name: "Bilibili", url: "https://t.bilibili.com/?spm_id_from=333.1007.0.0", icon: "https://static.hdslb.com/images/favicon.ico" },
                { name: "Google", url: "https://www.google.com", icon: "https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" },
                { name: "AI Studio", url: "https://aistudio.google.com", icon: "https://www.gstatic.com/aistudio/zero-state/promo_chat_url_context.png" },
                { name: "Bing", url: "https://www.bing.com", icon: "https://www.bing.com/favicon.ico" },
                { name: "GitHub", url: "https://github.com", icon: "https://github.githubassets.com/favicons/favicon.png" },
                { name: "ChatGPT", url: "https://chat.openai.com", icon: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" },
                { name: "YouTube", url: "https://www.youtube.com", icon: "https://www.youtube.com/s/desktop/1a96390c/img/favicon_144x144.png" },
                { name: "知乎", url: "https://www.zhihu.com", icon: "https://static.zhihu.com/heifetz/favicon.ico" },
                { name: "通义千问", url: "https://chat.qwen.ai/", icon: "https://th.bing.com/th/id/ODF.t2f33iHykG8jHQAup3syuA?w=32&h=32&qlt=90&pcl=fffffa&o=6&pid=1.2" },
                { name: "OpenWrt", url: "http://192.168.30.100", icon: "https://openwrt.org/_media/favicon.ico" },
                { name: "虎牙", url: "https://www.huya.com", icon: "https://a.msstatic.com/huya/hd/h5/static-source/main/logo2.png" },
                { name: "微博", url: "https://weibo.com", icon: "https://weibo.com/favicon.ico" },
                { name: "Gmail", url: "https://mail.google.com", icon: "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" },
                { name: "Notion", url: "https://www.notion.so", icon: "https://www.notion.so/images/favicon.ico" },
                { name: "Vercel", url: "https://vercel.com", icon: "https://assets.vercel.com/image/upload/front/favicon/vercel/favicon.ico" },
                { name: "IT之家", url: "https://www.ithome.com/pc/", icon: "//img.ithome.com/img/soft/ithome.svg" }
            ]
        };

        // --- 1. 时钟功能 (带秒针) ---
        function updateClock() {
            const now = new Date();

            // 获取时间
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            // 更新 DOM
            // 为了实现冒号闪烁，这里使用了HTML结构
            const colon = '<span class="colon">:</span>';
            document.getElementById('hour-min').innerHTML = `${h}${colon}${m}`;
            document.getElementById('sec').innerText = s;

            // 获取日期
            const dateOpts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date-str').innerText = now.toLocaleDateString('zh-CN', dateOpts);

            // 问候语
            const hour = now.getHours();
            let greet = "Good Evening";
            if (hour >= 5 && hour < 12) greet = "Good Morning";
            else if (hour >= 12 && hour < 18) greet = "Good Afternoon";
            document.getElementById('greeting').innerText = `${greet}, Captain.`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. 渲染链接 ---
        const container = document.getElementById('links-container');

        function renderLinks(keyword = '') {
            container.innerHTML = '';
            const list = config.links.filter(item =>
                item.name.toLowerCase().includes(keyword.toLowerCase())
            );

            list.forEach((link, i) => {
                const el = document.createElement('a');
                el.className = 'link-item';
                el.href = link.url;
                // 交错动画延迟
                el.style.animation = `slideInUp 0.5s ease forwards ${i * 0.03}s`;
                el.style.opacity = '0'; // 初始不可见

                const img = document.createElement('img');
                img.className = 'link-icon';
                img.src = link.icon;
                img.onerror = () => { img.src = `https://ui-avatars.com/api/?name=${link.name}&background=333&color=fff`; };

                const name = document.createElement('span');
                name.className = 'link-name';
                name.innerText = link.name;

                el.appendChild(img);
                el.appendChild(name);
                container.appendChild(el);
            });
        }
        renderLinks();

        // --- 3. 搜索交互 ---
        const sInput = document.getElementById('search-input');
        sInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && e.target.value) {
                // 回车跳转逻辑
                const match = config.links.find(l => l.name.toLowerCase().includes(e.target.value.toLowerCase()));
                const url = match ? match.url : `https://www.google.com/search?q=${encodeURIComponent(e.target.value)}`;
                window.location.href = url;
            } else {
                renderLinks(e.target.value);
            }
        });
    </script>
</body>

</html>
